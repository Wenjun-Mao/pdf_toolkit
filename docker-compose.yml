name: pdf-toolkit

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run pdfkit-web
    environment:
      PDFKIT_REDIS_URL: redis://redis:6379/0
      PDFKIT_DATABASE_URL: sqlite:///data/pdfkit.db
      PDFKIT_HOST: 0.0.0.0
      PDFKIT_PORT: 8000
    ports:
      - "127.0.0.1:8100:8000"
    labels:
      dev.orbstack.http-port: "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pdfkit_data:/app/data
    secrets:
      - pdfkit_admin_password
      - pdfkit_require_login
      - pdfkit_session_secret

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run pdfkit-worker
    environment:
      PDFKIT_REDIS_URL: redis://redis:6379/0
      PDFKIT_DATABASE_URL: sqlite:///data/pdfkit.db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - pdfkit_data:/app/data
    secrets:
      - pdfkit_admin_password
      - pdfkit_require_login
      - pdfkit_session_secret

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pdfkit_data:

secrets:
  pdfkit_admin_password:
    file: ./secrets/admin_password.txt
  pdfkit_require_login:
    file: ./secrets/require_login.txt
  pdfkit_session_secret:
    file: ./secrets/session_secret.txt
